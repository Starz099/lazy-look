<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11140f"/>
      <stop offset="100%" stop-color="#070807"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ff3d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8ff3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcff70"/>
      <stop offset="55%" stop-color="#c8ff3d"/>
      <stop offset="100%" stop-color="#9ee82a"/>
    </linearGradient>
  </defs>

  <!-- Squircle base -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#glow)"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#c8ff3d" stroke-opacity="0.28" stroke-width="4"/>

  <!-- Geometric "Look" lens / aperture -->
  <path d="M 104 256 C 156 164 356 164 408 256 C 356 348 156 348 104 256 Z"
        fill="#c8ff3d" fill-opacity="0.07"
        stroke="url(#limeGrad)" stroke-width="26" stroke-linejoin="round"/>

  <!-- Focus pupil -->
  <circle cx="256" cy="256" r="46" fill="url(#limeGrad)"/>
  <circle cx="242" cy="242" r="12" fill="#070807" opacity="0.35"/>
</svg>
