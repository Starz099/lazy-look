<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242730"/>
      <stop offset="100%" stop-color="#14161b"/>
    </linearGradient>

    <!-- Subtle border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Glass lens ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Inner glass fill -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.12"/>
    </linearGradient>

    <!-- AI Sparkle gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Handle gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Subtle grid lines in background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="80" y1="180" x2="432" y2="180"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="332" x2="432" y2="332"/>
    <line x1="180" y1="80" x2="180" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="332" y1="80" x2="332" y2="432"/>
  </g>

  <!-- Magnifying Lens Group -->
  <g>
    <!-- Handle -->
    <path d="M 292 292 L 388 388 C 400 400 400 418 388 430 C 376 442 358 442 346 430 L 250 334 Z"
          fill="url(#handleGrad)"/>
    <!-- Handle metallic highlight -->
    <path d="M 298 292 L 391 385 C 399 393 399 405 391 413 C 387 417 381 419 375 419 L 286 330 Z"
          fill="#ffffff" opacity="0.25"/>

    <!-- Lens Glass Fill -->
    <circle cx="216" cy="216" r="110" fill="url(#glassGrad)"/>

    <!-- Lens Outer Ring -->
    <circle cx="216" cy="216" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="24"/>

    <!-- Lens Inner Rim Reflection -->
    <circle cx="216" cy="216" r="96" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>

    <!-- Crescent glass highlight -->
    <path d="M 145 160 A 85 85 0 0 1 250 135" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

    <!-- AI Intelligence 4-point Star inside the lens -->
    <g filter="url(#glowFilter)">
      <!-- Main Star Sparkle -->
      <path d="M 216 156
               C 216 192 192 216 156 216
               C 192 216 216 240 216 276
               C 216 240 240 216 276 216
               C 240 216 216 192 216 156 Z"
            fill="url(#sparkleGrad)"/>

      <!-- Secondary small sparkle top right -->
      <path d="M 266 166
               C 266 178 256 188 244 188
               C 256 188 266 198 266 210
               C 266 198 276 188 288 188
               C 276 188 266 178 266 166 Z"
            fill="#93c5fd" opacity="0.9"/>
    </g>
  </g>
</svg>
